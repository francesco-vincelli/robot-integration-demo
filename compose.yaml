services:

  robot:
    build:
      context: .
      dockerfile: docker/robot.Dockerfile
      network: host

    container_name: robot-demo

    stdin_open: true
    tty: true

    environment:
      - ROS_DOMAIN_ID=42
      - ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET
      - TURTLEBOT3_MODEL=burger
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1

    volumes:
      - ./robot:/workspace/robot
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    networks:
      - robot_net

  attacker:
    build:
      context: .
      dockerfile: docker/attacker.Dockerfile
      network: host

    container_name: attacker-demo

    stdin_open: true
    tty: true

    environment:
      - ROS_DOMAIN_ID=42
      - ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET

    volumes:
      - ./attacker:/workspace/attacker

    networks:
      - robot_net

networks:

  robot_net:
    name: robot-security-net
    driver: bridge
